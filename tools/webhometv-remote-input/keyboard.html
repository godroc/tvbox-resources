<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebHomeTV 手机键盘</title>
<style>
body{margin:2rem auto;padding:0 1rem;max-width:36rem;font:1rem system-ui;color:#edf4ff;background:#131b27}
input,button{box-sizing:border-box;width:100%;padding:.8rem;margin:.4rem 0;font:inherit}
button{cursor:pointer}
</style>
</head>
<body>
<h1>WebHomeTV 手机键盘</h1>
<p id="status" role="status">正在配对</p>
<div id="devices"></div>
<form id="keyboard" hidden>
  <label for="draft" id="target">请在电视选中输入框</label>
  <input id="draft" type="text" maxlength="4000" autocomplete="off" spellcheck="false" disabled>
  <button id="send" disabled>发送到电视</button>
</form>
<form id="push" hidden>
  <h2>推送到电视</h2>
  <label for="share">粘贴网盘分享或视频地址</label>
  <input id="share" type="text" inputmode="url" maxlength="4000" autocomplete="off" required>
  <button id="send-share">发送资源</button>
  <p id="push-status" role="status"></p>
</form>
<script>
(function () {
  'use strict';
  const status = document.getElementById('status'), target = document.getElementById('target');
  const draft = document.getElementById('draft'), send = document.getElementById('send'), form = document.getElementById('keyboard');
  const pushForm = document.getElementById('push'), share = document.getElementById('share');
  const pushStatus = document.getElementById('push-status'), sendShare = document.getElementById('send-share');
  let token = '', field = null, allowed = false, sending = false, timer = null;
  function post(path, body) {
    return fetch('/webhometv/input-api' + path, {
      method: 'POST', cache: 'no-store',
      headers: {'Content-Type': 'application/json', Authorization: token ? 'Bearer ' + token : ''},
      body: JSON.stringify(body || {})
    }).then(r => {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    });
  }
  function update() {
    draft.disabled = !allowed;
    send.disabled = !allowed || sending;
  }
  async function poll() {
    try {
      const result = await post('/state'), next = result.field;
      if ((next && next.id) !== (field && field.id)) draft.value = '';
      field = next;
      allowed = !!field && (!field.sensitive || result.secure && location.protocol === 'https:');
      draft.type = field && field.sensitive ? 'password' : 'text';
      target.textContent = field ? field.label : '请在电视选中输入框';
      if (field && field.sensitive && !allowed) status.textContent = '密码和密钥请使用 HTTPS 输入入口';
      update();
    } catch (error) {
      allowed = false;
      update();
      if (error.message === '401') {
        clearTimeout(timer);
        token = '';
        pushForm.hidden = true;
        draft.value = '';
        status.textContent = '配对已过期，请从电视重新连接';
        return;
      }
      status.textContent = '连接暂不可用';
    }
    timer = setTimeout(poll, 700);
  }
  form.onsubmit = async function (event) {
    event.preventDefault();
    if (!field || !allowed || sending) return;
    const id = field.id;
    sending = true;
    update();
    try {
      await post('/send', {id: id, text: draft.value});
      draft.value = '';
      status.textContent = '已发送，请在电视上确认内容';
    } catch (error) {
      status.textContent = error.message === '409' ? '电视焦点已变化，请重选输入框' : '暂未发送，请重试';
    } finally {
      sending = false;
      update();
    }
  };
  pushForm.onsubmit = async function (event) {
    event.preventDefault();
    if (!token || sendShare.disabled) return;
    sendShare.disabled = true;
    try {
      await post('/push', {url: share.value.trim()});
      share.value = '';
      pushStatus.textContent = '已送达电视收件箱，在电视打开「推送」确认播放';
    } catch (error) {
      pushStatus.textContent = error.message === '409' ? '电视收件箱已满' : error.message === '400' ? '请输入支持的资源地址' : '推送失败，请检查配对';
    } finally {
      sendShare.disabled = false;
    }
  };
  const devices = document.getElementById('devices');
  let joining = false;
  function connected() {
    status.textContent = '已连接电视';
    form.hidden = false;
    pushForm.hidden = false;
    poll();
  }
  async function join(device) {
    if (joining) return;
    joining = true;
    devices.textContent = '';
    try {
      const result = await post('/join', {device});
      token = result.token;
      connected();
    } catch (error) {
      joining = false;
      status.textContent = '电视暂不可连接，请重试';
      showRetry();
    }
  }
  function showRetry() {
    devices.textContent = '';
    const button = document.createElement('button');
    button.textContent = '查找电视';
    button.onclick = discover;
    devices.appendChild(button);
  }
  async function discover() {
    if (joining) return;
    devices.textContent = '';
    try {
      const result = await post('/discover');
      if (result.devices.length === 1) {
        join(result.devices[0].id);
      } else if (result.devices.length) {
        status.textContent = '选择要连接的电视';
        result.devices.forEach(device => {
          const button = document.createElement('button');
          button.textContent = '电视 ' + device.number;
          button.onclick = () => join(device.id);
          devices.appendChild(button);
        });
      } else {
        status.textContent = '请先在电视设置里打开「连接手机键盘」';
        showRetry();
      }
    } catch (error) {
      status.textContent = '连接暂不可用';
      showRetry();
    }
  }
  discover();
})();
</script>
</body>
</html>
